    <style>
        :root {
            --pwi-blue: #004fa3;
            --pwi-orange: #f58220;
            --pwi-light-gray: #f8f9fa;
            --pwi-dark-gray: #343a40;
            --diff-add-bg: rgba(22, 163, 74, 0.1);
            --diff-del-bg: rgba(220, 38, 38, 0.1);
            --diff-mod-bg: rgba(245, 130, 32, 0.1);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--pwi-light-gray);
            color: var(--pwi-dark-gray);
        }

        /* Estilos da tabela de comparação */
        .fc {
            border-collapse: collapse;
            width: 100%;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            border-spacing: 0;
            table-layout: fixed;
        }

        .fc tr:hover td:not(.line-number) {
            background-color: #e9ecef !important;
        }

        .fc td {
            padding: 2px 12px;
            vertical-align: top;
            border-bottom: 1px solid #dee2e6;
            overflow: hidden;
        }

        .line-number {
            text-align: right;
            padding-right: 1em;
            color: #6c757d;
            user-select: none;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            position: sticky;
            left: 0;
            z-index: 1;
            width: 60px;
        }

        .fc .AlignCenter {
            text-align: center;
            font-weight: bold;
            background-color: #e9ecef;
            color: #495057;
            width: 40px;
            padding: 2px 0;
            user-select: none;
        }

        .fc .Wrap {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .TextItemSame {
            background-color: transparent;
        }

        .TextItemSigAdd,
        .TextItemSigRightMod {
            background-color: var(--diff-add-bg);
        }

        .TextItemSigDel,
        .TextItemSigLeftMod {
            background-color: var(--diff-del-bg);
        }

        .TextItemSigDiffMod {
            background-color: var(--diff-mod-bg);
        }

        .TextSegSigDiff {
            color: #d97706;
            font-weight: 700;
        }

        .TextItemSigDel .TextSegSigDiff,
        .TextItemSigLeftMod .TextSegSigDiff {
            text-decoration: line-through;
            text-decoration-color: #dc2626;
        }

        .highlight-diff {
            outline: 2px solid var(--pwi-blue);
            outline-offset: -2px;
        }

        .row-hidden {
            display: none !important;
        }

        .search-highlight {
            background-color: #fef08a !important;
            color: #854d0e !important;
            font-weight: bold;
        }

        .stats-filter {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .stats-filter:hover {
            background-color: #e5e7eb;
        }

        .active-filter {
            background-color: #dbeafe;
            color: #1e40af;
            font-weight: bold;
        }

        .sidebar-item-active {
            background-color: #eff6ff !important;
            border-left: 4px solid var(--pwi-blue);
            color: var(--pwi-blue) !important;
        }

        .sidebar-collapsed {
            width: 0px !important;
            min-width: 0px !important;
            overflow: hidden !important;
            padding: 0 !important;
            border: none !important;
        }

        /* Estilos de Validação no Fonte do Cliente */
        .val-applied {
            background-color: rgba(34, 197, 94, 0.08) !important;
        }
        .val-missing {
            background-color: rgba(239, 68, 68, 0.08) !important;
        }
        .val-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
            line-height: 1.2;
            user-select: none;
        }
        .val-badge-applied {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
        .val-badge-missing {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
    </style>
</head>

                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    <span id="client-folder-btn-label" class="truncate">Validar no Cliente</span>

    <!-- Content Area Principal -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">

        <!-- Header com Controles -->
        <header class="bg-white p-4 shadow-sm border-b border-gray-200 shrink-0">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center space-x-3">

                                d="M4 6h16M4 12h16M4 18h16"></path>

                <div class="flex flex-wrap items-center gap-2">

                        <input type="text" id="search-input" placeholder="Buscar no código..."

                        <button id="search-btn"

                        <button id="search-next-btn"

                    </div>

                    <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden text-xs">
                        <input type="text" id="goto-line-input" placeholder="Ir para linha..."
                            class="border-none px-2 py-1.5 w-24 focus:ring-0 text-xs">

            <!-- Filtros Secundários -->

                        (0):</label>

                        class="border border-gray-300 rounded px-2 py-1 text-xs bg-white focus:ring-0 w-44 truncate">

                    <span id="stats-total" class="stats-filter active-filter" data-filter-type="all">Total: 0</span>
                    <span id="stats-added" class="text-green-600 stats-filter" data-filter-type="added">Adições:
                        0</span>
                    <span id="stats-modified" class="text-yellow-600 stats-filter"
                        data-filter-type="modified">Modificações: 0</span>
                    <span id="stats-deleted" class="text-red-600 stats-filter" data-filter-type="deleted">Deleções:
                        0</span>
                </div>
            </div>

            <!-- Chips de ignorar -->

            <!-- Barra de Validação no Fonte do Cliente do Arquivo Ativo -->
            <div id="client-active-file-bar" class="hidden flex flex-wrap items-center justify-between gap-2 text-xs mt-2 pt-2 border-t border-gray-200 bg-blue-50/40 p-2 rounded-lg">
                <div class="flex items-center space-x-2">
                    <span class="text-gray-500 font-medium">Arquivo no Cliente:</span>
                    <span id="client-file-path-text" class="font-bold text-blue-800"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="client-val-badge" class="px-2 py-0.5 rounded-full font-bold text-[11px]"></span>
                    <label class="flex items-center space-x-1 cursor-pointer bg-white px-2 py-0.5 rounded border border-gray-300">
                        <input type="checkbox" id="show-only-unapplied" class="w-3.5 h-3.5 text-blue-600 rounded">
                        <span class="text-gray-700 font-medium">Apenas Não Aplicadas</span>
                    </label>

        <!-- Main Tabela de Código -->
        <main class="flex-1 overflow-auto p-4 bg-gray-50">

                <table class="fc">

                    </tbody>

    <!-- Dados do Lote embutidos -->
    <script id="batch-data" type="application/json">
[[BATCH_DATA_JSON]]
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const batchData = JSON.parse(document.getElementById('batch-data').textContent);
            let activeFileIndex = 0;

            // Storage key para checklist de release
            const storageKey = 'pwi_release_check_' + window.location.pathname;
            let completedFiles = new Set();
            try {
                const saved = localStorage.getItem(storageKey);
                if (saved) completedFiles = new Set(JSON.parse(saved));
            } catch (e) { }

            // DOM Elements
            const sidebar = document.getElementById('sidebar');
            const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
            const sidebarSearch = document.getElementById('sidebar-search');
            const sidebarFileList = document.getElementById('sidebar-file-list');
            const completedFilesBadge = document.getElementById('completed-files-badge');
            const currentFilenameHeading = document.getElementById('current-filename-heading');
            const diffTbody = document.getElementById('diff-tbody');

            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            const diffCounter = document.getElementById('diff-counter');
            const showOnlyDiffCheckbox = document.getElementById('show-only-diff');
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const searchNextBtn = document.getElementById('search-next-btn');
            const statsFilters = document.querySelectorAll('.stats-filter');
            const gotoLineInput = document.getElementById('goto-line-input');
            const gotoLineBtn = document.getElementById('goto-line-btn');
            const ignoreInput = document.getElementById('ignore-input');
            const ignoreBtn = document.getElementById('ignore-btn');
            const ignoreListContainer = document.getElementById('ignore-list-container');
            const methodFilter = document.getElementById('method-filter');
            const methodFilterLabel = document.getElementById('method-filter-label');

            // State
            let tableRows = [];
            let allDiffElements = [];
            let currentDiffIndex = -1;
            let searchResults = [];
            let currentSearchIndex = -1;
            let activeFilter = 'all';
            let ignoreList = ['top', 'left', 'height', 'width', 'tabindex'];

            // Formatação do nome para exibição no menu
            function formatDisplayName(rawName) {
                if (!rawName) return '';
                let name = rawName.trim();

                // Se já tiver prefixo conhecido, preserva
                if (name.startsWith('OBJETOS\\') || name.startsWith('REPORTS\\') || name.startsWith('FORMS\\')) {
                    return name;
                }

                const upper = name.toUpperCase();
                if (upper.endsWith('.PRG') || upper.includes('_PRG')) {
                    const clean = name.replace(/\.PRG$/i, '').replace(/_PRG$/i, '');
                    return `OBJETOS\\${clean}`;
                }
                if (upper.endsWith('.FRT') || upper.endsWith('.FRX') || upper.includes('_FRX')) {
                    const clean = name.replace(/\.(FRT|FRX)$/i, '').replace(/_FRX$/i, '');
                    return `REPORTS\\${clean}`;
                }
                if (upper.endsWith('.SCX') || upper.endsWith('.SCT') || upper.includes('_SCX')) {
                    const clean = name.replace(/\.(SCX|SCT)$/i, '').replace(/_SCX$/i, '');
                    return `FORMS\\${clean}`;
                }

                return name;
            }

            // Alternar sidebar
            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('sidebar-collapsed');
            });

            function toggleFileCompleted(rawFileName) {
                if (completedFiles.has(rawFileName)) {
                    completedFiles.delete(rawFileName);
                } else {
                    completedFiles.add(rawFileName);
                }
                try {
                    localStorage.setItem(storageKey, JSON.stringify(Array.from(completedFiles)));
                } catch (e) { }

                renderSidebarFiles(sidebarSearch.value);
            }

            function updateCompletedBadge() {
                if (completedFilesBadge) {
                    completedFilesBadge.textContent = `${completedFiles.size} / ${batchData.length} vistos`;
                }
            }

            // Render Sidebar File Items
            function renderSidebarFiles(filterTerm = '') {
                sidebarFileList.innerHTML = '';
                const term = filterTerm.trim().toLowerCase();

                batchData.forEach((fileItem, idx) => {
                    const displayName = formatDisplayName(fileItem.fileName);
                    if (term && !displayName.toLowerCase().includes(term) && !fileItem.fileName.toLowerCase().includes(term)) {
                        return;
                    }

                    const isDone = completedFiles.has(fileItem.fileName);
                    const cv = fileItem.clientValidation;

                    let clientBadgeHtml = '';
                    if (cv) {
                        if (!cv.isFound) {
                            clientBadgeHtml = `<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-red-100 text-red-700 border border-red-200" title="Arquivo não localizado na pasta do cliente">Ausente</span>`;
                        } else if (cv.total === 0) {
                            clientBadgeHtml = `<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-gray-100 text-gray-700" title="Sem alterações no comparador">0 diffs</span>`;
                        } else if (cv.missing === 0) {
                            clientBadgeHtml = `<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-green-100 text-green-800 border border-green-300" title="100% das alterações aplicadas no cliente">✓ 100%</span>`;
                        } else {
                            clientBadgeHtml = `<span class="text-[10px] px-1.5 py-0.5 rounded font-bold bg-yellow-100 text-yellow-800 border border-yellow-300" title="${cv.applied} de ${cv.total} alterações aplicadas (${cv.missing} pendentes)">⚠ ${cv.applied}/${cv.total}</span>`;
                        }
                    }

                    const container = document.createElement('div');
                    container.className = `w-full px-3 py-2 flex items-center justify-between hover:bg-gray-100 transition-colors text-xs border-b border-gray-100 cursor-pointer ${idx === activeFileIndex ? 'sidebar-item-active' : 'text-gray-700'}`;

                    container.innerHTML = `
                        <div class="flex items-center space-x-2 min-w-0 flex-1 pr-2">
                            <input type="checkbox" class="file-chk cursor-pointer w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500 shrink-0" ${isDone ? 'checked' : ''} title="Marcar como visto">
                            <span class="font-bold truncate ${isDone ? 'line-through text-gray-400' : ''}" title="${displayName}">${displayName}</span>
                        </div>
                        <div class="flex items-center space-x-1 shrink-0">
                            ${clientBadgeHtml}
                            <span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold ${isDone ? 'bg-green-100 text-green-800 border border-green-300' : fileItem.isError ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">
                                ${isDone ? '✓ Visto' : fileItem.isError ? 'Erro' : 'Alterado'}
                            </span>
                        </div>
                    `;

                    const cb = container.querySelector('.file-chk');
                    cb.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFileCompleted(fileItem.fileName);
                    });

                    container.addEventListener('click', () => {
                        selectFile(idx);
                    });

                    sidebarFileList.appendChild(container);
                });

                updateCompletedBadge();
            }

            sidebarSearch.addEventListener('input', (e) => {
                renderSidebarFiles(e.target.value);
            });

            // Select active file
            function selectFile(idx) {
                if (idx < 0 || idx >= batchData.length) return;
                activeFileIndex = idx;

                const fileItem = batchData[idx];
                const displayName = formatDisplayName(fileItem.fileName);
                currentFilenameHeading.textContent = displayName;

                diffTbody.innerHTML = fileItem.rowsHtml || '';
                tableRows = Array.from(diffTbody.querySelectorAll('tr'));

                renderSidebarFiles(sidebarSearch.value);
                detectAndTagBlocks();
                rebuildAndRecalculate();

                if (clientFilesIndex) {
                    runClientValidationForActiveFile();
                } else {
                    document.getElementById('client-active-file-bar')?.classList.add('hidden');
                }
            }

            function detectAndTagBlocks() {
                let currentBlockName = '';
                tableRows.forEach(row => {
                    const cells = Array.from(row.querySelectorAll('td')).filter(td => !td.classList.contains('line-number') && !td.classList.contains('AlignCenter'));
                    const leftText = cells[0] ? cells[0].textContent.replace(/\u00A0/g, ' ').trim() : '';
                    const rightText = cells[1] ? cells[1].textContent.replace(/\u00A0/g, ' ').trim() : '';
                    const codeText = rightText || leftText;

                    let blockMatch = codeText.match(/^<((?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);
                    if (blockMatch) {
                        currentBlockName = blockMatch[1].toUpperCase();
                    }
                    if (currentBlockName) {
                        row.dataset.blockName = currentBlockName;
                    }
                    if (currentBlockName && (codeText.toUpperCase().startsWith(`</${currentBlockName}>`) || codeText.match(/^<\/(?:(?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i))) {
                        currentBlockName = '';
                    }
                });
            }

            function updateMethodFilterSelect() {
                const previousSelection = methodFilter.value;
                methodFilter.innerHTML = '<option value="">Mostrar Todo o Código</option>';

                let changedBlocks = new Set();
                tableRows.forEach(row => {
                    if (row.dataset.blockName && row.dataset.diffType !== 'same') {
                        changedBlocks.add(row.dataset.blockName);
                    }
                });

                Array.from(changedBlocks).forEach(blockName => {
                    const option = document.createElement('option');
                    option.value = blockName;
                    option.textContent = blockName.replace('Object.', '').replace(/\s+Method\./i, ' - ').replace(/\s+(Properties|EXPR|TAG2?|PICTURE)$/i, ' - $1');
                    methodFilter.appendChild(option);
                });

                if (methodFilterLabel) {
                    methodFilterLabel.textContent = `Filtrar Método (${changedBlocks.size}):`;
                }

                if (previousSelection && changedBlocks.has(previousSelection)) {
                    methodFilter.value = previousSelection;
                } else {
                    methodFilter.value = "";
                }
            }

            methodFilter.addEventListener('change', applyFilters);

            function escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function startsWithIgnoredTerm(text) {
                if (!text) return false;
                const cleanText = text.trim();
                if (!cleanText) return false;
                return ignoreList.some(term => {
                    const t = term.trim();
                    if (!t) return false;
                    const regex = new RegExp('^' + escapeRegExp(t) + '([^a-zA-Z0-9_]|$)', 'i');
                    return regex.test(cleanText);
                });
            }

            function classifyRow(row) {
                const cells = Array.from(row.querySelectorAll('td')).filter(td => !td.classList.contains('line-number') && !td.classList.contains('AlignCenter'));
                const leftText = cells[0] ? cells[0].textContent.replace(/\u00A0/g, ' ') : '';
                const rightText = cells[1] ? cells[1].textContent.replace(/\u00A0/g, ' ') : '';

                if (startsWithIgnoredTerm(leftText) || startsWithIgnoredTerm(rightText)) {
                    return 'same';
                }

                if (row.querySelector('.TextItemSigAdd, .TextItemSigRightMod')) return 'added';
                if (row.querySelector('.TextItemSigDel, .TextItemSigLeftMod')) return 'deleted';
                if (row.querySelector('.TextItemSigDiffMod')) return 'modified';

                return 'same';
            }

            function updateStatsUI() {
                const selectedMethod = methodFilter.value;
                const stats = { total: 0, added: 0, modified: 0, deleted: 0 };

                tableRows.forEach(row => {
                    const blockMatch = !selectedMethod || row.dataset.blockName === selectedMethod;
                    if (blockMatch) {
                        stats.total++;
                        const diffType = row.dataset.diffType;
                        if (diffType !== 'same') {
                            stats[diffType]++;
                        }
                    }
                });

                document.getElementById('stats-total').textContent = `Total: ${stats.total}`;
                document.getElementById('stats-added').textContent = `Adições: ${stats.added}`;
                document.getElementById('stats-modified').textContent = `Modificações: ${stats.modified}`;
                document.getElementById('stats-deleted').textContent = `Deleções: ${stats.deleted}`;
            }

            function rebuildAndRecalculate() {
                detectAndTagBlocks();
                allDiffElements = [];
                tableRows.forEach((row, index) => {
                    const lineNumber = index + 1;
                    row.dataset.lineNumber = lineNumber;
                    
                    let lineTd = row.querySelector('.line-number');
                    if (!lineTd) {
                        lineTd = document.createElement('td');
                        lineTd.className = 'line-number';
                        row.prepend(lineTd);
                    }
                    lineTd.textContent = lineNumber;

                    row.style.backgroundColor = '';
                    const diffType = classifyRow(row);
                    row.dataset.diffType = diffType;
                    if (diffType !== 'same') {
                        allDiffElements.push(row);
                    }
                });

                updateMethodFilterSelect();
                updateStatsUI();
                applyFilters();
            }

            function getVisibleDiffs() {
                return allDiffElements.filter(el => !el.classList.contains('row-hidden'));
            }

            function applyFilters() {
                const hideSame = showOnlyDiffCheckbox.checked;
                const showOnlyUnapplied = document.getElementById('show-only-unapplied')?.checked || false;
                const selectedMethod = methodFilter.value;

                tableRows.forEach(row => {
                    const rowType = row.dataset.diffType;
                    const isSame = rowType === 'same';
                    const typeMatch = activeFilter === 'all' || rowType === activeFilter;
                    const blockMatch = !selectedMethod || row.dataset.blockName === selectedMethod;
                    const unappliedMatch = !showOnlyUnapplied || (rowType !== 'same' && row.dataset.validationStatus === 'missing');

                    if ((hideSame && isSame) || !typeMatch || !blockMatch || !unappliedMatch) {
                        row.classList.add('row-hidden');
                    } else {
                        row.classList.remove('row-hidden');
                    }
                });

                updateStatsUI();
                resetDiffNavigation();
            }

            function resetDiffNavigation() {
                currentDiffIndex = -1;
                const visibleDiffs = getVisibleDiffs();
                document.querySelectorAll('.highlight-diff').forEach(el => el.classList.remove('highlight-diff'));

                if (visibleDiffs.length === 0) {
                    diffCounter.textContent = "0 de 0";
                    nextBtn.disabled = true;
                    prevBtn.disabled = true;
                } else {
                    diffCounter.textContent = `0 de ${visibleDiffs.length}`;
                    nextBtn.disabled = false;
                    prevBtn.disabled = false;
                }
            }

            function navigateDiff(direction) {
                const visibleDiffs = getVisibleDiffs();
                if (visibleDiffs.length === 0) return;

                if (currentDiffIndex >= 0 && currentDiffIndex < visibleDiffs.length) {
                    visibleDiffs[currentDiffIndex].classList.remove('highlight-diff');
                }

                currentDiffIndex += direction;

                if (currentDiffIndex >= visibleDiffs.length) {
                    currentDiffIndex = 0;
                } else if (currentDiffIndex < 0) {
                    currentDiffIndex = visibleDiffs.length - 1;
                }

                const targetRow = visibleDiffs[currentDiffIndex];
                targetRow.classList.add('highlight-diff');
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });

                diffCounter.textContent = `${currentDiffIndex + 1} de ${visibleDiffs.length}`;
            }

            nextBtn.addEventListener('click', () => navigateDiff(1));
            prevBtn.addEventListener('click', () => navigateDiff(-1));
            showOnlyDiffCheckbox.addEventListener('change', applyFilters);

            // Teclas de atalho
            document.addEventListener('keydown', (e) => {
                const activeEl = document.activeElement;
                if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) {
                    return;
                }

                if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (!nextBtn.disabled) navigateDiff(1);
                } else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
                    e.preventDefault();
                    if (!prevBtn.disabled) navigateDiff(-1);
                }
            });

            // Ignore list management
            function renderIgnoreChips() {
                ignoreListContainer.innerHTML = '';
                ignoreList.forEach(term => {
                    const chip = document.createElement('span');
                    chip.className = 'inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-gray-200 text-gray-800';
                    chip.innerHTML = `${term} <button class="ml-1 text-gray-500 hover:text-red-600 font-bold">&times;</button>`;
                    chip.querySelector('button').addEventListener('click', () => {
                        ignoreList = ignoreList.filter(t => t !== term);
                        renderIgnoreChips();
                        rebuildAndRecalculate();
                        if (clientFilesIndex) runBatchClientValidation();
                    });
                    ignoreListContainer.appendChild(chip);
                });
            }

            ignoreBtn.addEventListener('click', () => {

                    renderIgnoreChips();

            // Text search
            function performSearch() {
                const term = searchInput.value.trim().toLowerCase();
                document.querySelectorAll('.search-highlight').forEach(el => el.classList.remove('search-highlight'));
                searchResults = [];
                currentSearchIndex = -1;

                if (!term) {
                    searchNextBtn.classList.add('hidden');
                    return;
                }

                tableRows.forEach(row => {
                    if (row.classList.contains('row-hidden')) return;

            function navigateSearch(direction) {
                if (searchResults.length === 0) return;
                currentSearchIndex += direction;
                if (currentSearchIndex >= searchResults.length) currentSearchIndex = 0;
                if (currentSearchIndex < 0) currentSearchIndex = searchResults.length - 1;

                const targetRow = searchResults[currentSearchIndex];

            // ==========================================
            // FoxPro Parser e Validação no Fonte do Cliente (Lote)
            // ==========================================
            class FoxProParser {
                decodeString(buffer, offset, length) {
                    const slice = buffer.slice(offset, offset + length);
                    const decoder = new TextDecoder('windows-1252');
                    let str = decoder.decode(slice);
                    const nullIdx = str.indexOf('\0');
                    if (nullIdx !== -1) {
                        str = str.substring(0, nullIdx);
                    }
                    return str.trim();
                }

                getMemoText(fptBuffer, blockNumber, blockSize) {
                    if (blockNumber === 0) return '';
                    const offset = blockNumber * blockSize;
                    if (offset >= fptBuffer.byteLength) return '';

                    const view = new DataView(fptBuffer);
                    const blockType = view.getUint32(offset, false);
                    const dataLength = view.getUint32(offset + 4, false);

                    if (blockType !== 1) return '';
                    return this.decodeString(fptBuffer, offset + 8, dataLength);
                }

                sortMethods(methodsText, objName) {
                    const methodLines = methodsText.split(/\r?\n/);
                    const methodBlocks = [];
                    let currentName = '_TOP_LEVEL';
                    let currentContent = [];

                    for (const line of methodLines) {
                        const match = line.match(/^\s*(?:PROCEDURE|PROC|FUNCTION|FUNC)\s+([a-zA-Z0-9_.]+)/i);
                        if (match) {
                            if (currentContent.length > 0) {
                                methodBlocks.push({ name: currentName, content: currentContent });
                            }
                            currentName = match[1].toUpperCase();
                            currentContent = [line];
                        } else {
                            currentContent.push(line);
                        }
                    }
                    if (currentContent.length > 0) {
                        methodBlocks.push({ name: currentName, content: currentContent });
                    }

                    methodBlocks.sort((a, b) => a.name.localeCompare(b.name));
                    let output = '';
                    for (const block of methodBlocks) {
                        if (block.name === '_TOP_LEVEL') {
                            if (block.content.join('').trim()) {
                                output += `<Object.${objName} Method._TopLevel>\n`;
                                output += block.content.join('\n').trimEnd() + '\n';
                                output += `</Object.${objName} Method._TopLevel>\n\n`;
                            }
                        } else {
                            output += `<Object.${objName} Method.${block.name}>\n`;
                            output += block.content.join('\n').trimEnd() + '\n';
                            output += `</Object.${objName} Method.${block.name}>\n\n`;
                        }
                    }
                    return output.trimEnd() + '\n';
                }

                parsePrg(prgText) {
                    const methodLines = prgText.split(/\r?\n/);
                    const methodBlocks = [];
                    let currentName = '_TOP_LEVEL';
                    let currentContent = [];

                    for (const line of methodLines) {
                        const match = line.match(/^\s*(?:PROCEDURE|PROC|FUNCTION|FUNC)\s+([a-zA-Z0-9_.]+)/i);
                        if (match) {
                            if (currentContent.length > 0) {
                                methodBlocks.push({ name: currentName, content: currentContent });
                            }
                            currentName = match[1].toUpperCase();
                            currentContent = [line];
                        } else {
                            currentContent.push(line);
                        }
                    }
                    if (currentContent.length > 0) {
                        methodBlocks.push({ name: currentName, content: currentContent });
                    }

                    let output = '';
                    for (const block of methodBlocks) {
                        if (block.name === '_TOP_LEVEL') {
                            if (block.content.join('').trim()) {
                                output += `<PRG_TopLevel>\n`;
                                output += block.content.join('\n').trimEnd() + '\n';
                                output += `</PRG_TopLevel>\n\n`;
                            }
                        } else {
                            output += `<PRG_Method ${block.name}>\n`;
                            output += block.content.join('\n').trimEnd() + '\n';
                            output += `</PRG_Method ${block.name}>\n\n`;
                        }
                    }
                    return output.trimEnd() + '\n';
                }

                parse(scxBuffer, sctBuffer) {
                    const scxView = new DataView(scxBuffer);
                    const sctView = new DataView(sctBuffer);

                    const blockSize = sctView.getUint16(6, false);
                    const numRecords = scxView.getUint32(4, true);
                    const headerLength = scxView.getUint16(8, true);
                    const recordLength = scxView.getUint16(10, true);

                    const fields = [];
                    let currentOffset = 32;
                    let recordOffset = 1;

                    while (currentOffset < headerLength) {
                        const firstByte = scxView.getUint8(currentOffset);
                        if (firstByte === 0x0D) break;

                        const name = this.decodeString(scxBuffer, currentOffset, 11);
                        const type = String.fromCharCode(scxView.getUint8(currentOffset + 11));
                        const length = scxView.getUint8(currentOffset + 16);

                        fields.push({ name, type, length, offset: recordOffset });
                        recordOffset += length;
                        currentOffset += 32;
                    }

                    const objects = {};

                    for (let i = 0; i < numRecords; i++) {
                        const rowOffset = headerLength + (i * recordLength);
                        if (rowOffset >= scxBuffer.byteLength) break;
                        const isDeleted = scxView.getUint8(rowOffset) === 0x2A;
                        if (isDeleted) continue;

                        let objName = '';
                        let parentName = '';
                        let properties = '';
                        let methods = '';
                        let expr = '';
                        let tag = '';
                        let tag2 = '';
                        let picture = '';

                        for (const field of fields) {
                            const fieldOffset = rowOffset + field.offset;
                            if (field.name === 'OBJNAME' || field.name === 'NAME') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    objName = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                } else {
                                    objName = this.decodeString(scxBuffer, fieldOffset, field.length);
                                }
                                objName = objName.toUpperCase();
                            } else if (field.name === 'PARENT') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    parentName = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                } else {
                                    parentName = this.decodeString(scxBuffer, fieldOffset, field.length);
                                }
                                parentName = parentName.toUpperCase();
                            } else if (field.name === 'PROPERTIES') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    properties = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                }
                            } else if (field.name === 'METHODS') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    methods = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                }
                            } else if (field.name === 'EXPR') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    expr = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                }
                            } else if (field.name === 'TAG') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    tag = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                }
                            } else if (field.name === 'TAG2') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    tag2 = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                }
                            } else if (field.name === 'PICTURE') {
                                if (field.type === 'M') {
                                    const blockNumber = scxView.getUint32(fieldOffset, true);
                                    picture = this.getMemoText(sctBuffer, blockNumber, blockSize);
                                }
                            }
                        }

                        if (!objName) objName = `Row_${i}`;

                        if (objName) {
                            if (parentName.trim()) {
                                objName = `${parentName.trim()}.${objName.trim()}`;
                            }
                            if (objects[objName]) {
                                let counter = 2;
                                while (objects[`${objName}_${counter}`]) counter++;
                                objName = `${objName}_${counter}`;
                            }
                            objects[objName] = { properties, methods, expr, tag, tag2, picture };
                        }
                    }

                    let output = '';
                    const sortedNames = Object.keys(objects).sort();

                    for (const name of sortedNames) {
                        const { properties, methods, expr, tag, tag2, picture } = objects[name];
                        if (properties.trim()) {
                            output += `<Object.${name} Properties>\n`;
                            const lines = properties.split('\n');
                            for (const line of lines) {
                                if (line.trim()) output += `   ${line.trim()}\n`;
                            }
                            output += `</Object.${name} Properties>\n`;
                        }
                        const sortedMethods = this.sortMethods(methods, name);
                        if (sortedMethods.trim()) {
                            output += sortedMethods.trim() + '\n\n';
                        }
                        if (expr.trim()) {
                            output += `<Object.${name} EXPR>\n`;
                            const lines = expr.split('\n');
                            for (const line of lines) {
                                if (line.trim()) output += `   ${line.trim()}\n`;
                            }
                            output += `</Object.${name} EXPR>\n\n`;
                        }
                        if (tag.trim()) {
                            output += `<Object.${name} TAG>\n`;
                            const lines = tag.split('\n');
                            for (const line of lines) {
                                if (line.trim()) output += `   ${line.trim()}\n`;
                            }
                            output += `</Object.${name} TAG>\n\n`;
                        }
                        if (tag2.trim()) {
                            output += `<Object.${name} TAG2>\n`;
                            const lines = tag2.split('\n');
                            for (const line of lines) {
                                if (line.trim()) output += `   ${line.trim()}\n`;
                            }
                            output += `</Object.${name} TAG2>\n\n`;
                        }
                        if (picture.trim()) {
                            output += `<Object.${name} PICTURE>\n`;
                            const lines = picture.split('\n');
                            for (const line of lines) {
                                if (line.trim()) output += `   ${line.trim()}\n`;
                            }
                            output += `</Object.${name} PICTURE>\n\n`;
                        }
                    }
                    return output;
                }
            }

            let clientFilesIndex = null;

            async function readFilesFromDirectoryHandle(dirHandle, path = '') {
                const files = [];
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        const file = await entry.getFile();
                        const relativePath = path ? `${path}/${file.name}` : `${dirHandle.name}/${file.name}`;
                        Object.defineProperty(file, 'webkitRelativePath', {
                            value: relativePath,
                            writable: false,
                            configurable: true
                        });
                        files.push(file);
                    } else if (entry.kind === 'directory') {
                        const subFiles = await readFilesFromDirectoryHandle(entry, path ? `${path}/${entry.name}` : `${dirHandle.name}/${entry.name}`);
                        files.push(...subFiles);
                    }
                }
                return files;
            }

            function indexClientFiles(files) {
                const outsideStob = { byPath: new Map(), byBase: new Map() };
                const insideStob = { byPath: new Map(), byBase: new Map() };

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const rawRel = (file.webkitRelativePath || file.name).replace(/\\/g, '/');
                    const segments = rawRel.split('/');
                    const internalPath = segments.length > 1 ? segments.slice(1).join('/') : rawRel;
                    const upperInternal = internalPath.toUpperCase();

                    const isStob = upperInternal.startsWith('STOB/') || upperInternal === 'STOB';
                    const cleanInternal = isStob ? internalPath.substring(5) : internalPath;
                    const cleanUpper = cleanInternal.toUpperCase();

                    const lastDot = cleanInternal.lastIndexOf('.');
                    if (lastDot === -1) continue;

                    const ext = cleanInternal.substring(lastDot + 1).toLowerCase();
                    const basePath = cleanInternal.substring(0, lastDot);
                    const upperBasePath = cleanUpper.substring(0, lastDot);

                    const fileNameOnly = cleanInternal.split('/').pop();
                    const baseNameOnly = fileNameOnly.substring(0, fileNameOnly.lastIndexOf('.')).toUpperCase();

                    const targetIndex = isStob ? insideStob : outsideStob;

                    if (!targetIndex.byPath.has(upperBasePath)) {
                        targetIndex.byPath.set(upperBasePath, {
                            basePath,
                            displayPath: internalPath,
                            isStob,
                            primaryFile: null,
                            binaryMemoFile: null,
                            ext: ''
                        });
                    }
                    const pathEntry = targetIndex.byPath.get(upperBasePath);
                    if (ext === 'scx' || ext === 'frx' || ext === 'vcx' || ext === 'prg') {
                        pathEntry.primaryFile = file;
                        pathEntry.ext = ext;
                        pathEntry.displayPath = internalPath;
                    } else if (ext === 'sct' || ext === 'frt' || ext === 'vct') {
                        pathEntry.binaryMemoFile = file;
                    }

                    if (!targetIndex.byBase.has(baseNameOnly)) {
                        targetIndex.byBase.set(baseNameOnly, pathEntry);
                    } else {
                        const existing = targetIndex.byBase.get(baseNameOnly);
                        if (!existing.primaryFile && pathEntry.primaryFile) {
                            targetIndex.byBase.set(baseNameOnly, pathEntry);
                        }
                    }
                }

                return { outsideStob, insideStob };
            }

            function resolveClientFile(targetName, clientIndex) {
                if (!clientIndex) return null;
                let raw = (targetName || '').trim().replace(/\\/g, '/');
                raw = raw.replace(/\[\[NOME_FORM\]\]/g, '').trim();
                if (!raw) return null;

                // Remove extensões conhecidas (.prg, .scx, .frx, .vcx, etc.)
                let cleanTarget = raw.replace(/\.(scx|sct|frx|frt|prg|vcx|vct|html|txt)$/i, '');
                
                // Se começar com STOB/, remove o prefixo STOB/ para resolução
                if (cleanTarget.toUpperCase().startsWith('STOB/')) {
                    cleanTarget = cleanTarget.substring(5);
                }

                const upperTarget = cleanTarget.toUpperCase();
                const parts = cleanTarget.split('/');
                const baseName = parts[parts.length - 1].toUpperCase();

                // Candidatos para nome base (ex: IE_VERIF)
                const candidateBases = new Set();
                candidateBases.add(baseName);

                // Se o nome contiver ou começar com prefixos conhecidos (OBJETOS, REPORTS, FORMS, PRG, STOB)
                // mesmo sem barra (ex: OBJETOSIE_VERIF por causa de escape de string no JavaScript)
                const folderPrefixes = ['OBJETOS', 'REPORTS', 'FORMS', 'PRG', 'STOB'];
                for (const p of folderPrefixes) {
                    if (baseName.startsWith(p) && baseName.length > p.length) {
                        const stripped = baseName.substring(p.length).replace(/^[/_\\]+/, '');
                        if (stripped) candidateBases.add(stripped);
                    }
                }

                // Candidatos para caminhos relativos (ex: OBJETOS/IE_VERIF, PRG/IE_VERIF, IE_VERIF)
                const candidatePaths = new Set();
                candidatePaths.add(upperTarget);
                for (const b of candidateBases) {
                    if (!b) continue;
                    candidatePaths.add(b);
                    candidatePaths.add(`OBJETOS/${b}`);
                    candidatePaths.add(`REPORTS/${b}`);
                    candidatePaths.add(`FORMS/${b}`);
                    candidatePaths.add(`PRG/${b}`);
                }

                const { outsideStob, insideStob } = clientIndex;

                // 1. Prioridade: busca primeiro fora da pasta STOB (raiz, OBJETOS, REPORTS, PRG, etc.)
                for (const cPath of candidatePaths) {
                    if (outsideStob.byPath.has(cPath) && outsideStob.byPath.get(cPath).primaryFile) {
                        return outsideStob.byPath.get(cPath);
                    }
                }
                for (const b of candidateBases) {
                    if (b && outsideStob.byBase.has(b) && outsideStob.byBase.get(b).primaryFile) {
                        return outsideStob.byBase.get(b);
                    }
                }

                // 2. Não encontrou fora, busca dentro da pasta STOB
                for (const cPath of candidatePaths) {
                    if (insideStob.byPath.has(cPath) && insideStob.byPath.get(cPath).primaryFile) {
                        return insideStob.byPath.get(cPath);
                    }
                }
                for (const b of candidateBases) {
                    if (b && insideStob.byBase.has(b) && insideStob.byBase.get(b).primaryFile) {
                        return insideStob.byBase.get(b);
                    }
                }

                return null;
            }

            async function parseResolvedClientFile(resolvedItem, parser) {
                if (!resolvedItem || !resolvedItem.primaryFile) return '';
                const ext = (resolvedItem.ext || '').toLowerCase();

                if (ext === 'prg') {
                    const buf = await resolvedItem.primaryFile.arrayBuffer();
                    const dec = new TextDecoder('windows-1252');
                    return parser.parsePrg(dec.decode(buf));
                }

                if ((ext === 'scx' || ext === 'frx' || ext === 'vcx') && resolvedItem.binaryMemoFile) {
                    const pBuf = await resolvedItem.primaryFile.arrayBuffer();
                    const mBuf = await resolvedItem.binaryMemoFile.arrayBuffer();
                    return parser.parse(pBuf, mBuf);
                }

                const buf = await resolvedItem.primaryFile.arrayBuffer();
                const dec = new TextDecoder('windows-1252');
                return dec.decode(buf);
            }

            function parseTextIntoBlocks(text) {
                const lines = text.split(/\r?\n/);
                const blockMap = new Map();
                let currentBlock = '_GLOBAL';
                blockMap.set(currentBlock, []);

                for (const line of lines) {
                    const trimmed = line.trim();
                    const openMatch = trimmed.match(/^<((?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);
                    if (openMatch) {
                        currentBlock = openMatch[1].toUpperCase();
                        if (!blockMap.has(currentBlock)) {
                            blockMap.set(currentBlock, []);
                        }
                        continue;
                    }
                    if (currentBlock !== '_GLOBAL' && (trimmed.toUpperCase().startsWith(`</${currentBlock}>`) || trimmed.match(/^<\/(?:(?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i))) {
                        currentBlock = '_GLOBAL';
                        continue;
                    }
                    if (blockMap.has(currentBlock)) {
                        blockMap.get(currentBlock).push(line);
                    }
                }
                return { blockMap, allLines: lines };
            }

            function normalizeCode(str) {
                if (!str) return '';
                return str
                    .replace(/\u00A0/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();
            }

            function lineMatches(normLine, normTarget) {
                if (!normLine || !normTarget) return false;
                return normLine === normTarget || normLine.includes(normTarget);
            }

            function formatClientDisplayPath(resolved) {
                if (!resolved) return '';
                let p = (resolved.displayPath || '').replace(/\//g, '\\');
                if (resolved.isStob && !p.toUpperCase().startsWith('STOB\\') && p.toUpperCase() !== 'STOB') {
                    p = 'STOB\\' + p;
                }
                while (p.toUpperCase().startsWith('STOB\\STOB\\')) {
                    p = p.substring(5);
                }
                return p;
            }

            async function runBatchClientValidation() {
                if (!clientFilesIndex) return;

                const parser = new FoxProParser();
                let filesWithAllApplied = 0;
                let filesFound = 0;

                for (let i = 0; i < batchData.length; i++) {
                    const item = batchData[i];
                    const resolved = resolveClientFile(item.fileName, clientFilesIndex);

                    if (!resolved) {
                        item.clientValidation = {
                            isFound: false,
                            path: '',
                            applied: 0,
                            missing: 0,
                            total: 0
                        };
                        continue;
                    }

                    filesFound++;
                    const clientText = await parseResolvedClientFile(resolved, parser);
                    const { blockMap, allLines } = parseTextIntoBlocks(clientText);

                    // Cria tabela temporária para extrair linhas de diff do arquivo
                    const tempDiv = document.createElement('tbody');
                    tempDiv.innerHTML = item.rowsHtml || '';
                    const rows = Array.from(tempDiv.querySelectorAll('tr'));

                    let currBlock = '';
                    rows.forEach(r => {
                        const cells = Array.from(r.querySelectorAll('td')).filter(td => !td.classList.contains('line-number') && !td.classList.contains('AlignCenter'));
                        const leftText = cells[0] ? cells[0].textContent.replace(/\u00A0/g, ' ').trim() : '';
                        const rightText = cells[1] ? cells[1].textContent.replace(/\u00A0/g, ' ').trim() : '';
                        const codeText = rightText || leftText;

                        const blockMatch = codeText.match(/^<((?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);
                        if (blockMatch) currBlock = blockMatch[1].toUpperCase();
                        if (currBlock) r.dataset.blockName = currBlock;
                        if (currBlock && (codeText.toUpperCase().startsWith(`</${currBlock}>`) || codeText.match(/^<\/(?:(?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i))) currBlock = '';
                    });

                    let applied = 0;
                    let missing = 0;
                    let total = 0;

                    rows.forEach(r => {
                        const diffType = classifyRow(r);
                        if (diffType === 'same') return;
                        total++;

                        const cells = Array.from(r.querySelectorAll('td')).filter(td => !td.classList.contains('line-number') && !td.classList.contains('AlignCenter'));
                        const leftText = cells[0] ? cells[0].textContent.replace(/\u00A0/g, ' ').trim() : '';
                        const rightText = cells[1] ? cells[1].textContent.replace(/\u00A0/g, ' ').trim() : '';

                        let targetLine = '';
                        let isDeleted = false;
                        if (diffType === 'added' || diffType === 'modified') {
                            targetLine = rightText;
                        } else if (diffType === 'deleted') {
                            targetLine = leftText;
                            isDeleted = true;
                        }

                        const normTarget = normalizeCode(targetLine);
                        const blockName = r.dataset.blockName ? r.dataset.blockName.toUpperCase() : '';
                        const blockLines = blockName && blockMap.has(blockName) ? blockMap.get(blockName) : null;
                        const blockExistsInClient = blockName ? blockMap.has(blockName) : false;

                        const isOpeningTag = targetLine.match(/^<((?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);
                        const isClosingTag = targetLine.match(/^<\/(?:(?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);

                        let isApp = false;
                        if (isOpeningTag || isClosingTag) {
                            isApp = isDeleted ? !blockExistsInClient : blockExistsInClient;
                        } else if (!normTarget) {
                            isApp = true;
                        } else {
                            if (blockName && blockName !== '_GLOBAL' && blockName !== 'PRG_TOPLEVEL') {
                                if (blockLines && blockLines.length > 0) {
                                    const foundInBlock = blockLines.some(l => lineMatches(normalizeCode(l), normTarget));
                                    isApp = isDeleted ? !foundInBlock : foundInBlock;
                                } else {
                                    isApp = isDeleted ? true : false;
                                }
                            } else {
                                const targetLines = (blockMap.has('PRG_TOPLEVEL') ? blockMap.get('PRG_TOPLEVEL') : null) 
                                                 || (blockMap.has('_GLOBAL') ? blockMap.get('_GLOBAL') : null) 
                                                 || allLines;
                                const found = targetLines.some(l => lineMatches(normalizeCode(l), normTarget));
                                isApp = isDeleted ? !found : found;
                            }
                        }

                        if (isApp) applied++;
                        else missing++;
                    });

                    item.clientValidation = {
                        isFound: true,
                        path: formatClientDisplayPath(resolved),
                        applied,
                        missing,
                        total
                    };

                    if (missing === 0 && total > 0) {
                        filesWithAllApplied++;
                    }
                }

                const banner = document.getElementById('client-batch-status-banner');
                const summaryText = document.getElementById('client-batch-summary-text');
                if (banner && summaryText) {
                    banner.classList.remove('hidden');
                    summaryText.textContent = `${filesWithAllApplied}/${batchData.length} arquivos 100% aplicados (${filesFound} encontrados)`;
                }

                renderSidebarFiles(sidebarSearch.value);
                runClientValidationForActiveFile();
            }

            async function runClientValidationForActiveFile() {
                if (!clientFilesIndex || activeFileIndex < 0 || activeFileIndex >= batchData.length) return;

                const fileItem = batchData[activeFileIndex];
                const resolved = resolveClientFile(fileItem.fileName, clientFilesIndex);

                const activeBar = document.getElementById('client-active-file-bar');
                const pathText = document.getElementById('client-file-path-text');
                const valBadge = document.getElementById('client-val-badge');

                if (!resolved) {
                    if (activeBar) activeBar.classList.remove('hidden');
                    if (pathText) {
                        pathText.textContent = `Não encontrado no cliente: '${fileItem.fileName}' (nem fora nem dentro da STOB)`;
                        pathText.className = 'font-bold text-red-600';
                    }
                    if (valBadge) {
                        valBadge.className = 'px-2 py-0.5 rounded-full font-bold text-[11px] bg-red-100 text-red-800 border border-red-300';
                        valBadge.textContent = 'Arquivo Ausente';
                    }

                    tableRows.forEach(r => {
                        delete r.dataset.validationStatus;
                        r.classList.remove('val-applied', 'val-missing');
                        const b = r.querySelector('.val-badge');
                        if (b) b.remove();
                    });
                    applyFilters();
                    return;
                }

                const formattedDisplayPath = formatClientDisplayPath(resolved);
                if (activeBar) activeBar.classList.remove('hidden');
                if (pathText) {
                    pathText.textContent = formattedDisplayPath;
                    pathText.className = 'font-bold text-blue-800';
                }

                const parser = new FoxProParser();
                const clientText = await parseResolvedClientFile(resolved, parser);
                const { blockMap, allLines } = parseTextIntoBlocks(clientText);

                let appliedCount = 0;
                let missingCount = 0;
                let totalDiffRows = 0;

                tableRows.forEach(row => {
                    const diffType = row.dataset.diffType;
                    const existingBadge = row.querySelector('.val-badge');
                    if (existingBadge) existingBadge.remove();

                    if (diffType === 'same' || !diffType) {
                        delete row.dataset.validationStatus;
                        row.classList.remove('val-applied', 'val-missing');
                        return;
                    }

                    totalDiffRows++;

                    const cells = Array.from(row.querySelectorAll('td')).filter(td => !td.classList.contains('line-number') && !td.classList.contains('AlignCenter'));
                    const leftText = cells[0] ? cells[0].textContent.replace(/\u00A0/g, ' ').trim() : '';
                    const rightText = cells[1] ? cells[1].textContent.replace(/\u00A0/g, ' ').trim() : '';

                    let targetLine = '';
                    let isDeleted = false;

                    if (diffType === 'added' || diffType === 'modified') {
                        targetLine = rightText;
                    } else if (diffType === 'deleted') {
                        targetLine = leftText;
                        isDeleted = true;
                    }

                    const normTarget = normalizeCode(targetLine);
                    const blockName = row.dataset.blockName ? row.dataset.blockName.toUpperCase() : '';
                    const blockLines = blockName && blockMap.has(blockName) ? blockMap.get(blockName) : null;
                    const blockExistsInClient = blockName ? blockMap.has(blockName) : false;

                    const isOpeningTag = targetLine.match(/^<((?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);
                    const isClosingTag = targetLine.match(/^<\/(?:(?:Object\.[^\s>]+\s+(?:Method\.[^\s>]+|Properties|EXPR|TAG2?|PICTURE))|(?:PRG[_\s]Method\s+[^\s>]+)|(?:PRG_TopLevel))>/i);

                    let isApplied = false;

                    if (isOpeningTag || isClosingTag) {
                        isApplied = isDeleted ? !blockExistsInClient : blockExistsInClient;
                    } else if (!normTarget) {
                        isApplied = true;
                    } else {
                        if (blockName && blockName !== '_GLOBAL' && blockName !== 'PRG_TOPLEVEL') {
                            if (blockLines && blockLines.length > 0) {
                                const foundInBlock = blockLines.some(l => lineMatches(normalizeCode(l), normTarget));
                                isApplied = isDeleted ? !foundInBlock : foundInBlock;
                            } else {
                                isApplied = isDeleted ? true : false;
                            }
                        } else {
                            const targetLines = (blockMap.has('PRG_TOPLEVEL') ? blockMap.get('PRG_TOPLEVEL') : null) 
                                             || (blockMap.has('_GLOBAL') ? blockMap.get('_GLOBAL') : null) 
                                             || allLines;
                            const found = targetLines.some(l => lineMatches(normalizeCode(l), normTarget));
                            isApplied = isDeleted ? !found : found;
                        }
                    }

                    row.dataset.validationStatus = isApplied ? 'applied' : 'missing';
                    row.classList.toggle('val-applied', isApplied);
                    row.classList.toggle('val-missing', !isApplied);

                    const badge = document.createElement('span');
                    badge.className = `val-badge ${isApplied ? 'val-badge-applied' : 'val-badge-missing'}`;
                    badge.textContent = isApplied ? '✓ Aplicado' : '✗ Não Aplicado';
                    badge.title = isApplied 
                        ? `Alteração confirmada no fonte do cliente (${formattedDisplayPath})` 
                        : `Alteração NÃO encontrada no fonte do cliente (${formattedDisplayPath})`;

                    const lineNumTd = row.querySelector('.line-number');
                    if (lineNumTd) {
                        lineNumTd.appendChild(badge);
                    }

                    if (isApplied) appliedCount++;
                    else missingCount++;
                });

                if (valBadge) {
                    if (totalDiffRows === 0) {
                        valBadge.className = 'px-2 py-0.5 rounded-full font-bold text-[11px] bg-gray-100 text-gray-700';
                        valBadge.textContent = 'Sem alterações a validar';
                    } else if (missingCount === 0) {
                        valBadge.className = 'px-2 py-0.5 rounded-full font-bold text-[11px] bg-green-100 text-green-800 border border-green-300';
                        valBadge.textContent = `✓ ${appliedCount}/${totalDiffRows} aplicadas (100%)`;
                    } else {
                        valBadge.className = 'px-2 py-0.5 rounded-full font-bold text-[11px] bg-yellow-100 text-yellow-800 border border-yellow-300';
                        valBadge.textContent = `⚠ ${appliedCount}/${totalDiffRows} aplicadas (${missingCount} pendente${missingCount > 1 ? 's' : ''})`;
                    }
                }

                applyFilters();
            }

            function clearClientValidation() {
                clientFilesIndex = null;
                document.getElementById('client-folder-btn-label').textContent = 'Validar no Cliente';
                document.getElementById('client-batch-status-banner').classList.add('hidden');
                document.getElementById('client-active-file-bar').classList.add('hidden');
                const chk = document.getElementById('show-only-unapplied');
                if (chk) chk.checked = false;

                batchData.forEach(item => {
                    delete item.clientValidation;
                });

                tableRows.forEach(r => {
                    delete r.dataset.validationStatus;
                    r.classList.remove('val-applied', 'val-missing');
                    const b = r.querySelector('.val-badge');
                    if (b) b.remove();
                });

                renderSidebarFiles(sidebarSearch.value);
                applyFilters();
            }

            async function handleClientFolderSelected(files, folderName = '') {
                if (!files || files.length === 0) return;
                clientFilesIndex = indexClientFiles(files);
                const labelEl = document.getElementById('client-folder-btn-label');
                if (labelEl) {
                    labelEl.textContent = folderName ? `📁 ${folderName}` : `📁 ${files.length} arquivos`;
                }
                await runBatchClientValidation();
            }

            const clientDirLabel = document.getElementById('btn-select-client-dir');
            if (clientDirLabel && 'showDirectoryPicker' in window) {
                clientDirLabel.addEventListener('click', async (e) => {
                    e.preventDefault();
                    try {
                        const handle = await window.showDirectoryPicker({ id: 'client_source_dir' });
                        const files = await readFilesFromDirectoryHandle(handle);
                        await handleClientFolderSelected(files, handle.name);
                    } catch (err) {
                        if (err.name !== 'AbortError') console.error(err);
                    }
                });
            }

            const clientFolderInput = document.getElementById('client-folder-input');
            if (clientFolderInput) {
                clientFolderInput.addEventListener('change', async (e) => {
                    const files = e.target.files;
                    if (files && files.length > 0) {
                        const rootName = files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : '';
                        await handleClientFolderSelected(Array.from(files), rootName);
                    }
                });
            }

            const btnClearClientVal = document.getElementById('btn-clear-client-val');
            if (btnClearClientVal) {
                btnClearClientVal.addEventListener('click', clearClientValidation);
            }

            const showOnlyUnappliedChk = document.getElementById('show-only-unapplied');
            if (showOnlyUnappliedChk) {
                showOnlyUnappliedChk.addEventListener('change', applyFilters);
            }

            // Init
            renderIgnoreChips();
            if (batchData.length > 0) {
                selectFile(0);
            }
        });
    </script>
</body>
